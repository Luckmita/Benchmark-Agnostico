[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-benchmark-core"
version = "0.1.0"
description = "Neutral, reproducible benchmark infrastructure for AI and ML agents"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
benchmark-cli = "benchmark_core.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
